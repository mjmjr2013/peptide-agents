  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 font-display: swap;\n  src: url(\"9dbaf1e0-3759-437e-a793-8be78a2a8f81\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e455abf5-921c-44ef-8656-5ec43d2c2ef4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ebdda11c-f19b-410c-953b-c4e37e9eb444\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"16752e62-0ce9-4ee4-8c0f-2f5c900fc3ee\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"a940c27c-f18e-47dc-bb30-e954ca6277d1\"><\u002Fscript>\n<script src=\"fb73fb4a-4897-4d25-a4e6-f81ec253ca37\"><\u002Fscript>\n<style>\n  body { margin: 0; -webkit-font-smoothing: antialiased; }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent-900); text-decoration: underline; }\n  button { font: inherit; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text)\">\n\n  <div style=\"position:sticky;top:0;z-index:40;background:#031432;border-bottom:1px solid var(--color-accent);padding:0 20px\">\n    <div style=\"max-width:1180px;margi style=\"position:absolute;top:-146px;left:0;width:760px;height:auto;display:block\">\n      <\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:12px;letter-spacing:0.26em;text-transform:uppercase;color:var(--color-accent-400);margin-bottom:26px\">Research peptides · Research use only<\u002Fdiv>\n      <h1 style=\"font-size:clamp(46px,9vw,112px);line-height:0.9;margin:0;letter-spacing:-0.025em;text-transform:uppercase;color:#f7f8fa;max-width:19ch;text-wrap:balance\">Sourced direct from the lab. No resellers in between.<\u002Fh1>\n      <p style=\"font-size:19px;line-height:1.6;max-width:54ch;color:rgba(233,238,244,.76);text-wrap:pretty;margin:32px 0 0\">Most research peptides reach the end buyer through several layers of resellers, each adding a margin. Northline establishes direct laboratory access and aggregates member demand into a single procurement channel. We leverage our collective volume to secure pricing unavailable to the individual buyer, with third-party testing published in full and prompt dispatch on every order.<\u002Fp>\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:40px\">\n        <a class=\"btn btn-primary\" href=\"{{ waLink }}\" style=\"gap:10px;padding:14px 22px\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z\"><\u002Fpath><\u002Fsvg>\n          Message our lab rep on WhatsApp\n        <\u002Fa>\n        <a class=\"btn btn-secondary\" href=\"/coa/\" style=\"padding:14px 22px;border-color:rgba(89,128,166,.7);color:#e9eef4\">See the lab results<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"{{ discordLink }}\" style=\"padding:14px 20px;gap:10px;color:#e9eef4\" style-hover=\"background:rgba(148,188,227,.12);color:#f7f8fa\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8.5 4.5a14 14 0 0 0-4.4 1.6C2.6 9 2 12.2 2.2 15.6a13 13 0 0 0 4 2 9 9 0 0 0 .9-1.5\"><\u002Fpath><path d=\"M15.5 4.5a14 14 0 0 1 4.4 1.6c1.5 2.9 2.1 6.1 1.9 9.5a13 13 0 0 1-4 2 9 9 0 0 1-.9-1.5\"><\u002Fpath><path d=\"M7.5 16.5c3 1.3 6 1.3 9 0\"><\u002Fpath><circle cx=\"9\" cy=\"12\" r=\"1.2\"><\u002Fcircle><circle cx=\"15\" cy=\"12\" r=\"1.2\"><\u002Fcircle><\u002Fsvg>\n          Join the Discord\n        <\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--color-accent-400);margin-top:18px;letter-spacing:0.04em\">\n        <span>Instant replies, 24/7.<\u002Fspan>\n        <span>Community launching soon.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ heroWall }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:72px 0 80px;display:grid;gap:56px;grid-template-columns:minmax(300px,0.85fr) minmax(320px,1.15fr);align-items:start\">\n      <div>\n        <div style=\"font-family:var(--font-heading);font-size:12px;letter-spacing:0.26em;text-transform:uppercase;color:var(--color-accent-400);margin-bottom:22px\">Research peptides · Research use only<\u002Fdiv>\n        <h1 style=\"font-size:clamp(38px,5.4vw,62px);line-height:0.95;margin:0;letter-spacing:-0.02em;text-transform:uppercase;color:#f7f8fa;text-wrap:balance\">Direct from the lab. Twenty-five compounds, no middlemen.<\u002Fh1>\n        <p style=\"font-size:17px;line-height:1.6;color:rgba(233,238,244,.76);text-wrap:pretty;margin:26px 0 0;max-width:44ch\">You're buying from the lab, not the third reseller down the chain — so the pricing is direct, the testing is published in full, and it ships the same week. Tell our lab rep what you need.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-top:34px\">\n          <a class=\"btn btn-primary\" href=\"{{ waLink }}\" style=\"gap:10px;padding:14px 22px\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z\"><\u002Fpath><\u002Fsvg>\n            Message our lab rep on WhatsApp\n          <\u002Fa>\n          <span style=\"font-size:13px;color:var(--color-accent-400);letter-spacing:0.04em\">Instant replies, 24/7.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"blueprint\" style=\"border-color:rgba(89,128,166,.6);padding:22px 24px 26px\">\n        <i class=\"corner tl\" style=\"color:var(--color-accent)\"><\u002Fi><i class=\"corner tr\" style=\"color:var(--color-accent)\"><\u002Fi><i class=\"corner bl\" style=\"color:var(--color-accent)\"><\u002Fi><i class=\"corner br\" style=\"color:var(--color-accent)\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--color-accent-400);padding-bottom:14px;border-bottom:1px solid rgba(89,128,166,.45)\">In stock now<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 34px\">\n          <sc-for list=\"{{ wall }}\" as=\"w\" hint-placeholder-count=\"20\">\n            <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid rgba(89,128,166,.28)\">\n              <span style=\"font-family:var(--font-heading);font-size:16px;line-height:1.2;text-transform:uppercase;color:#f7f8fa\">{{ w.name }}<\u002Fspan>\n              <span style=\"font-size:11px;letter-spacing:0.1em;color:var(--color-accent-400);white-space:nowrap;font-variant-numeric:tabular-nums\">{{ w.sizes }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n ;font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px\">01 · Catalog<\u002Fdiv>\n        <h2 style=\"font-size:clamp(30px,4vw,44px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:-0.01em\">What we carry<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;max-width:42ch;text-wrap:pretty;color:color-mix(in srgb, var(--color-text) 70%, transparent)\">All sizes held in stock. Message the lab rep with the compound and size — no prices published on the site.<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"5\">\n      <div style=\"padding-top:44px\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:18px\">\n          <h3 style=\"font-family:var(--font-heading);font-size:22px;text-transform:uppercase;letter-spacing:0.06em;margin:0\">{{ g.cat }}<\u002Fh3>\n          <span style=\"flex:1 1 auto;height:1px;background:color-mix(in srgb, var(--color-text) 14%, transparent)\"><\u002Fspan>\n          <span style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 50%, transparent)\">{{ g.note }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))\">\n          <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <div class=\"blueprint\" style=\"padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;transition:background .12s\" style-hover=\"background:var(--color-accent-100)\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div>\n                <div style=\"font-family:var(--font-heading);font-size:20px;line-height:1.15;text-transform:uppercase\">{{ it.name }}<\u002Fdiv>\n                <div style=\"font-size:12px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 60%, transparent);margin-top:5px\">{{ it.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:auto\">\n                <sc-for list=\"{{ it.sizes }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <span class=\"tag tag-outline\" style=\"font-size:11px;letter-spacing:0.06em;font-variant-numeric:tabular-nums\">{{ s }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section id=\"ordering\" style=\"max-width:1180px;margin:0 auto;padding:88px 20px 0\">\n    <div style=\"border-bottom:2px solid var(--color-accent);padding-bottom:16px\">\n      <div style=\"font-family:var(--font-heading);font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px\">02 · Ordering<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,4vw,44px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:-0.01em\">How it works<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));padding-top:36px\">\n      <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n        <div class=\"blueprint\" style=\"padding:22px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-family:var(--font-heading);font-size:13px;letter-spacing:0.2em;color:var(--color-accent-700)\">{{ st.n }}<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:24px;line-height:1.1;text-transform:uppercase;margin:14px 0 10px\">{{ st.title }}<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.65;text-wrap:pretty;color:color-mix(in srgb, var(--color-text) 74%, transparent)\">{{ st.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div class=\"blueprint\" style=\"margin-top:26px;padding:30px 32px;background:#031432;border-color:var(--color-accent);display:flex;gap:28px;align-items:center;justify-content:space-between;flex-wrap:wrap\">\n      <i class=\"corner tl\" style=\"color:var(--color-accent)\"><\u002Fi><i class=\"corner tr\" style=\"color:var(--color-accent)\"><\u002Fi><i class=\"corner bl\" style=\"color:var(--color-accent)\"><\u002Fi><i class=\"corner br\" style=\"color:var(--color-accent)\"><\u002Fi>\n      <div style=\"max-width:56ch\">\n        <div style=\"font-family:var(--font-heading);font-size:28px;line-height:1.1;text-transform:uppercase;color:#f7f8fa\">Message our lab rep on WhatsApp<\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:rgba(233,238,244,.75);text-wrap:pretty\">Tell them the compound, the size and the quantity. Instant replies, 24/7 — including stock, shipping and testing questions.<\u002Fp>\n      <\u002Fdiv>\n      <a class=\"btn btn-primary\" href=\"{{ waLink }}\" style=\"gap:10px;padding:14px 22px;flex:none\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z\"><\u002Fpath><\u002Fsvg>\n        Start a chat\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1180px;margin:0 auto;padding:88px 20px 0\">\n    <div style=\"border-bottom:2px solid var(--color-accent);padding-bottom:16px\">\n      <div style=\"font-family:var(--font-heading);font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px\">03 · Shipping<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,4vw,44px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:-0.01em\">Two fulfillment routes<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:26px 0 0;font-size:16px;line-height:1.7;max-width:64ch;text-wrap:pretty;color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Every order is fulfilled from one of two facilities. Domestic stock is positioned for speed; the primary facility carries the full catalog at the lowest landed cost. Our rep will confirm which route applies to your compounds before you commit.<\u002Fp>\n    <div style=\"display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));padding-top:30px\">\n      <sc-for list=\"{{ routes }}\" as=\"r\" hint-placeholder-count=\"2\">\n        <div class=\"blueprint\" style=\"padding:24px 26px 26px;display:flex;flex-direction:column;gap:18px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div>\n            <div style=\"font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--color-accent-700)\">{{ r.kicker }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-size:27px;line-height:1.1;text-transform:uppercase;margin-top:10px\">{{ r.title }}<\u002Fdiv>\n            <p style=\"margin:10px 0 0;font-size:14px;line-height:1.65;text-wrap:pretty;color:color-mix(in srgb, var(--color-text) 74%, transparent)\">{{ r.body }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:0;margin-top:auto\">\n            <sc-for list=\"{{ r.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid color-mix(in srgb, var(--color-text) 10%, transparent);font-size:13px\">\n                <span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 52%, transparent);padding-top:2px\">{{ row.k }}<\u002Fspan>\n                <span style=\"text-align:right;color:var(--color-accent-700)\">{{ row.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:16px 0 0;font-size:13px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">Transit times are typical door-to-door estimates from dispatch, not guarantees.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"max-width:1180px;margin:0 auto;padding:88px 20px 0\">\n    <div style=\"display:grid;gap:44px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start\">\n      <div>\n        <div style=\"font-family:var(--font-heading);font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px\">04 · About<\u002Fdiv>\n        <h2 style=\"font-size:clamp(30px,4vw,44px);line-height:1;margin:0 0 24px;text-transform:uppercase;letter-spacing:-0.01em\">Northline Group<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.7;text-wrap:pretty;max-width:52ch\">Northline is a collective buying group for research peptides. Direct laboratory access is rare in this market. Supply moves through successive resellers, each adding a margin, and none able to document what is actually in the vial. We establish that relationship on our members' behalf and consolidate their demand into a single channel. We leverage our collective volume to secure pricing no individual buyer can command. We also publish what the lab says about every compound we hold — purity, identity, sterility and endotoxin, in full, on a page you can reach from the vial itself.<\u002Fp>\n        <p style=\"margin:0;font-size:16px;line-height:1.7;text-wrap:pretty;max-width:52ch;color:color-mix(in srgb, var(--color-text) 76%, transparent)\">Nothing ships without a report behind it. If a product doesn't clear, we don't sell it.<\u002Fp>\n      <\u002Fdiv>\n      <figure style=\"margin:0\">\n        <div class=\"blueprint duotone\" style=\"height:320px;position:relative\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <image-slot id=\"home-about\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop a vial or bench photo\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <figcaption style=\"margin-top:10px;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">Photograph slot — drop in a real image<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showTestimonials }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"max-width:1180px;margin:0 auto;padding:88px 20px 0\">\n    <div style=\"border-bottom:2px solid var(--color-accent);padding-bottom:16px\">\n      <div style=\"font-family:var(--font-heading);font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px\">05 · Feedback<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,4vw,44px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:-0.01em\">From researchers<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));padding-top:36px\">\n      <sc-for list=\"{{ quotes }}\" as=\"q\" hint-placeholder-count=\"3\">\n        <div class=\"blueprint\" style=\"padding:24px;border-style:dashed;display:flex;flex-direction:column;gap:16px;min-height:170px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-size:16px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 45%, transparent);text-wrap:pretty\">{{ q.slot }}<\u002Fdiv>\n          <div style=\"margin-top:auto;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-700)\">{{ q.attr }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:16px 0 0;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700)\">Placeholder — send me real quotes and I'll set them, or switch this section off.<\u002Fp>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <footer style=\"margin-top:96px;background:#031432;color:rgba(233,238,244,.72);padding:0 20px;border-top:1px solid var(--color-accent)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:46px 0 54px;display:flex;justify-content:space-between;gap:36px;flex-wrap:wrap;align-items:flex-start\">\n      <img src=\"d8872724-512e-4a7f-b086-7b178aa52b38\" alt=\"Northline Group\" style=\"height:64px;width:auto;display:block\">\n      <div style=\"max-width:44ch;font-size:12px;line-height:1.65;text-wrap:pretty\">\n        All products supplied by Northline Group are for laboratory research use only. Not for human or veterinary use, food, drug, or household purposes.\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:9px;font-size:12px\">\n        <span style=\"font-family:var(--font-heading);letter-spacing:0.18em;text-transform:uppercase;color:var(--color-accent-400)\">Get in touch<\u002Fspan>\n        <a href=\"{{ waLink }}\" style=\"color:#f7f8fa\" style-hover=\"color:var(--color-accent-400)\">WhatsApp — lab rep<\u002Fa>\n        <a href=\"/coa/\" style=\"color:#f7f8fa\" style-hover=\"color:var(--color-accent-400)\">Lab results<\u002Fa>\n        <a href=\"{{ discordLink }}\" style=\"color:#f7f8fa\" style-hover=\"color:var(--color-accent-400)\">Discord community<\u002Fa>\n        <a href=\"mailto:jordan@northlinesupplies.com\" style=\"color:#f7f8fa\" style-hover=\"color:var(--color-accent-400)\">jordan@northlinesupplies.com<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;claim&quot;,&quot;wall&quot;],&quot;default&quot;:&quot;claim&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page&quot;},&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;85292909474&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page&quot;},&quot;discordLink&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page&quot;},&quot;showTestimonials&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Page&quot;}}\">\nclass Component extends DCLogic {\n  state = { hero: null };\n\n  catalog = [\n    { cat: \"Metabolic\", note: \"Weight & metabolic\", items: [\n      { name: \"GLP-3 RT\", desc: \"Triple GIP/GLP-1/GCG agonist\", sizes: [\"10 mg\", \"20 mg\", \"30 mg\", \"60 mg\", \"100 mg\"] },\n      { name: \"Tirzepatide\", desc: \"Dual GIP/GLP-1 agonist\", sizes: [\"10 mg\", \"30 mg\", \"50 mg\"] },\n      { name: \"Semaglutide\", desc: \"GLP-1 analog\", sizes: [\"10 mg\"] },\n    ]},\n    { cat: \"Support\", note: \"GH secretagogues & analogs\", items: [\n      { name: \"Tesamorelin\", desc: \"trans-3-hexenoyl-GRF (1-44)\", sizes: [\"10 mg\", \"20 mg\"] },\n      { name: \"IGF-1 LR3\", desc: \"Long R3 IGF-1 analog\", sizes: [\"1 mg\"] },\n      { name: \"CJC-1295 + Ipamorelin\", desc: \"Blend, no DAC\", sizes: [\"10 mg blend\"] },\n    ]},\n    { cat: \"Wellness\", note: \"Repair & tissue blends\", items: [\n      { name: \"GLOW 70\", desc: \"BPC-157 + TB-500 + GHK-Cu\", sizes: [\"70 mg blend\"] },\n      { name: \"KLOW 80\", desc: \"BPC-157 + TB-500 + GHK-Cu + KPV\", sizes: [\"80 mg blend\"] },\n      { name: \"Wolverine\", desc: \"BPC-157 + TB-500\", sizes: [\"20 mg blend\"] },\n      { name: \"GHK-Cu\", desc: \"Gly-His-Lys · Cu²⁺\", sizes: [\"100 mg\"] },\n      { name: \"Melanotan II\", desc: \"MT2 — melanocortin agonist\", sizes: [\"10 mg\"] },\n    ]},\n    { cat: \"Cognitive\", note: \"Mitochondrial & neuro\", items: [\n      { name: \"MOTS-c\", desc: \"MRWQEMGYIFYPRKLR\", sizes: [\"10 mg\", \"40 mg\"] },\n      { name: \"NAD⁺\", desc: \"Nicotinamide adenine dinucleotide\", sizes: [\"1000 mg\"] },\n      { name: \"Semax\", desc: \"MEHFPGP\", sizes: [\"10 mg\"] },\n      { name: \"DSIP\", desc: \"WAGGDASGE\", sizes: [\"10 mg\"] },\n      { name: \"SS-31\", desc: \"D-Arg-Dmt-Lys-Phe-NH₂\", sizes: [\"50 mg\"] },\n    ]},\n    { cat: \"Supplies\", note: \"Reconstitution\", items: [\n      { name: \"Bacteriostatic Water\", desc: \"0.9% benzyl alcohol, meets USP\", sizes: [\"10 mL\"] },\n    ]},\n  ];\n\n  steps = [\n    { n: \"01\", title: \"Message the rep\", body: \"Send the compound, size and quantity on WhatsApp. Your order is consolidated with the group's volume. Replies are instant, day or night.\" },\n    { n: \"02\", title: \"Check the testing\", body: \"Every product is sent for third-party HPLC and mass spec testing on a rolling schedule, and the reports are published in full before you commit.\" },\n    { n: \"03\", title: \"Ships from stock\", body: \"Dispatched from stock with tracking. The QR on the vial takes you straight to that product's current report.\" },\n  ];\n\n  renderVals() {\n    const hero = this.state.hero ?? (this.props.heroStyle ?? \"claim\");\n    const skus = this.catalog.reduce((n, g) => n + g.items.reduce((m, i) => m + i.sizes.length, 0), 0);\n    const on = \"var(--color-accent)\", off = \"transparent\";\n    return {\n      groups: this.catalog,\n      steps: this.steps,\n      skuCount: String(skus),\n      wall: this.catalog.flatMap((g) => g.items.map((i) => ({\n        name: i.name,\n        sizes: i.sizes.length > 2 ? i.sizes.length + \" sizes\" : i.sizes.join(\" · \"),\n      }))),\n      routes: [\n        {\n          kicker: \"Route A · Domestic\",\n          title: \"United States facility\",\n          body: \"Held domestically for expedited delivery. A curated selection of high-demand compounds, priced to reflect the cost of forward-positioned inventory.\",\n          rows: [\n            { k: \"Transit\", v: \"≈3 days\" },\n            { k: \"Catalog\", v: \"Selected compounds\" },\n            { k: \"Pricing\", v: \"Premium for speed\" },\n            { k: \"Tracking\", v: \"Included\" },\n          ],\n        },\n        {\n          kicker: \"Route B · Primary\",\n          title: \"International facility\",\n          body: \"Our main warehouse, adjacent to the laboratory. It carries the complete catalog — including compounds not stocked domestically — at our lowest pricing, with a longer transit window.\",\n          rows: [\n            { k: \"Transit\", v: \"≈14 days\" },\n            { k: \"Catalog\", v: \"Full range\" },\n            { k: \"Pricing\", v: \"Lowest available\" },\n            { k: \"Tracking\", v: \"Included\" },\n          ],\n        },\n      ],\n      quotes: [\n        { slot: \"Quote slot — a line about purity or consistency.\", attr: \"Attribution\" },\n        { slot: \"Quote slot — a line about how fast ordering was.\", attr: \"Attribution\" },\n        { slot: \"Quote slot — a line about the published reports.\", attr: \"Attribution\" },\n      ],\n      showTestimonials: this.props.showTestimonials ?? true,\n      heroClaim: hero === \"claim\",\n      heroWall: hero === \"wall\",\n      claimBg: hero === \"claim\" ? on : off,\n      claimFg: hero === \"claim\" ? \"#031432\" : \"#e9eef4\",\n      wallBg: hero === \"wall\" ? on : off,\n      wallFg: hero === \"wall\" ? \"#031432\" : \"#e9eef4\",\n      pickClaim: () => this.setState({ hero: \"claim\" }),\n      pickWall: () => this.setState({ hero: \"wall\" }),\n      discordLink: this.props.discordLink ?? \"#\",\n      waLink: \"https://wa.me/\" + String(this.props.whatsapp ?? \"85292909474\").replace(/[^0-9]/g, \"\") + \"?text=\" + encodeURIComponent(\"Hi — I'd like to ask about a compound.\"),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
